services:
  - type: web
    name: kaidostar-backend
    # NOTE: Pro auto-submit drives a real Chromium browser (Playwright). The
    # native python env below downloads the browser in the build, but Chromium's
    # OS libraries may be missing on the native runtime - if so, auto-submit
    # degrades safely to the manual hand-off. For guaranteed auto-submit support,
    # deploy the Dockerfile instead (it runs `playwright install --with-deps
    # chromium`): set `env: docker` and remove the buildCommand.
    env: python
    buildCommand: "pip install -r requirements.txt && python -m playwright install chromium"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: NCAA_API_BASE
        sync: false
      - key: NCAA_API_KEY
        sync: false
      - key: ROBOFLOW_MODEL_ID
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: SCAN_INTERVAL_MINUTES
        value: "1440"
      # Comma-separated user ids allowed to add listings by hand (POST /listings/manual).
      # Unset = nobody can; those listings reach every user's Job Search pool.
      - key: KAIDOSTAR_ADMIN_USER_IDS
        sync: false
      # Employer career-site feeds (Greenhouse, Lever, Ashby, SmartRecruiters, Workable,
      # Recruitee). A long random secret; a free pinger calls /feeds/tick?key=<it> every
      # 10 minutes to keep the crawl going (and, on the free plan, the service awake).
      # Unset = the endpoint is off (the crawl still runs while the service is awake).
      - key: FEED_TICK_KEY
        sync: false
      # Stop adding employer jobs when the database reaches this size (Supabase free = 500 MB).
      - key: FEED_DB_CEILING_MB
        value: "400"
      # Optional: federal jobs from USAJOBS (free key from developer.usajobs.gov).
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_EMAIL
        sync: false
 
